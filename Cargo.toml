[workspace]
members = [
  "crates/arc-live",
  "crates/capture",
  "crates/collector",
  "crates/capture-service",
  "crates/core",
  "crates/diagnostics",
  "crates/release-tool",
  "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
brotli = "8.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
compact_str = "0.8"
crossbeam-channel = "0.5"
directories = "6.0"
ed25519-dalek = "2.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "links"] }
etherparse = "0.15"
flate2 = "1.1"
hex = "0.4"
libloading = "0.8"
open = "5.4"
pcapsql-core = { path = "vendor/pcapsql-core", default-features = false }
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zeroize = "1.8"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Win32_Networking_WinSock",
  "Win32_System_IO",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
